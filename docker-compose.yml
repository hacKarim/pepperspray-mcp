services:
  # Flask API Server - Runs security tools
  pepperspray-server:
    build: .
    container_name: pepperspray-server
    hostname: pepperspray-server
    ports:
      - "8888:8888"  # Flask API endpoint
    environment:
      - PEPPERSPRAY_PORT=8888
      - PEPPERSPRAY_HOST=0.0.0.0
      - DEBUG_MODE=false
      - COMMAND_TIMEOUT=300
    volumes:
      - ./data/results:/app/results
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs
    restart: unless-stopped
    networks:
      - pepperspray-net
    command: python3 pepperspray_server.py --port 8888

  # MCP Server with TCP Bridge - Connects AI agents to API
  pepperspray-mcp:
    build: .
    container_name: pepperspray-mcp
    hostname: pepperspray-mcp
    ports:
      - "5001:5000"  # MCP TCP bridge (host:5001 -> container:5000)
    environment:
      - PEPPERSPRAY_SERVER=http://pepperspray-server:8888
      - MCP_BRIDGE_PORT=5000
      - DEBUG_MODE=false
    depends_on:
      - pepperspray-server
    restart: unless-stopped
    networks:
      - pepperspray-net
    command: python3 tcp_stdio_bridge.py

networks:
  pepperspray-net:
    driver: bridge
    name: pepperspray-network
