services:
  pepperspray:
    build: .
    image: pepperspray:2.0.0
    container_name: pepperspray
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PEPPERSPRAY_MODEL=${PEPPERSPRAY_MODEL:-claude-opus-4-8}
      - PEPPERSPRAY_RESULTS_DIR=/app/results
    volumes:
      - ./data/results:/app/results
    # Keep stdin open so the stdio MCP server can be attached:
    #   docker attach pepperspray        (MCP client)
    # Or run the CLI ad hoc:
    #   docker compose run --rm pepperspray pepperspray run --target <t> --authorized
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Optional local vulnerable target for authorized integration testing.
  # Enable with:  docker compose --profile integration up
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: pepperspray-juice-shop
    profiles: ["integration"]
    ports:
      - "3000:3000"
    restart: unless-stopped
