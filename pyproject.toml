[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepperspray"
version = "2.0.0"
description = "LangGraph multi-agent framework for authorized security assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "httpx>=0.27",
    "cachetools>=5",
    "psutil>=5.9",
    "mcp>=1.0",
    "fastmcp>=0.2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
ollama = ["langchain-ollama>=1.0"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff", "black"]

[project.scripts]
pepperspray = "pepperspray.interfaces.cli:app"

[tool.setuptools.packages.find]
include = ["pepperspray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "legacy"
